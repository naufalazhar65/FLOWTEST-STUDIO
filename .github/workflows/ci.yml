name: FlowTest Studio CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    name: Test and Build

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: |
          mkdir -p artifacts/test-results

          npx vitest run \
            --config vitest.unit.config.ts \
            --reporter=default \
            --reporter=junit \
            --outputFile.junit=artifacts/test-results/junit.xml

      - name: Run build
        run: npm run build

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-report
          path: artifacts/test-results/junit.xml
          if-no-files-found: error

      - name: Upload execution artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flowtest-execution-artifacts
          path: artifacts/execution
          if-no-files-found: warn